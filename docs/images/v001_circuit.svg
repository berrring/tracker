<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="850" height="480" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <text x="425" y="35" fill="#38bdf8" font-size="22" font-weight="bold" text-anchor="middle">V0.0.1: ESP32 &lt;-&gt; SIM800L Wiring Diagram</text>
  <text x="425" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">GSM Initialization, AT Commands &amp; 1k/2k Logic Level Shifter</text>

  <!-- ESP32 Module -->
  <rect x="60" y="100" width="220" height="320" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="130" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">ESP32 DevKit</text>
  
  <rect x="75" y="160" width="190" height="30" rx="4" fill="#334155"/>
  <text x="85" y="180" fill="#f8fafc" font-size="12">GPIO 16 (RX2)</text>
  <circle cx="255" cy="175" r="5" fill="#10b981"/>

  <rect x="75" y="210" width="190" height="30" rx="4" fill="#334155"/>
  <text x="85" y="230" fill="#f8fafc" font-size="12">GPIO 17 (TX2)</text>
  <circle cx="255" cy="225" r="5" fill="#f43f5e"/>

  <rect x="75" y="260" width="190" height="30" rx="4" fill="#334155"/>
  <text x="85" y="280" fill="#f8fafc" font-size="12">GND</text>
  <circle cx="255" cy="275" r="5" fill="#64748b"/>

  <rect x="75" y="310" width="190" height="30" rx="4" fill="#334155"/>
  <text x="85" y="330" fill="#f8fafc" font-size="12">5V / VIN (USB)</text>
  <circle cx="255" cy="325" r="5" fill="#f59e0b"/>

  <!-- Voltage Divider Box -->
  <rect x="340" y="180" width="180" height="110" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="430" y="202" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">Voltage Divider</text>
  <text x="430" y="222" fill="#c7d2fe" font-size="11" text-anchor="middle">R1: 1kΩ (3.3V -&gt; 2.2V)</text>
  <text x="430" y="240" fill="#c7d2fe" font-size="11" text-anchor="middle">R2: 2kΩ (to GND)</text>
  <text x="430" y="260" fill="#e0e7ff" font-size="10" text-anchor="middle">Protects SIM800L 2.8V UART</text>

  <!-- SIM800L Module -->
  <rect x="580" y="100" width="220" height="320" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="690" y="130" fill="#f43f5e" font-size="18" font-weight="bold" text-anchor="middle">SIM800L Module</text>

  <rect x="595" y="160" width="190" height="30" rx="4" fill="#334155"/>
  <circle cx="605" cy="175" r="5" fill="#10b981"/>
  <text x="620" y="180" fill="#f8fafc" font-size="12">TXD</text>

  <rect x="595" y="210" width="190" height="30" rx="4" fill="#334155"/>
  <circle cx="605" cy="225" r="5" fill="#f43f5e"/>
  <text x="620" y="230" fill="#f8fafc" font-size="12">RXD (2.2V - 2.8V max)</text>

  <rect x="595" y="260" width="190" height="30" rx="4" fill="#334155"/>
  <circle cx="605" cy="275" r="5" fill="#64748b"/>
  <text x="620" y="280" fill="#f8fafc" font-size="12">GND</text>

  <rect x="595" y="310" width="190" height="30" rx="4" fill="#334155"/>
  <circle cx="605" cy="325" r="5" fill="#ef4444"/>
  <text x="620" y="330" fill="#f8fafc" font-size="12">VCC (3.7V - 4.2V 2A)</text>

  <rect x="595" y="360" width="190" height="42" rx="6" fill="#78350f" stroke="#f59e0b"/>
  <text x="690" y="380" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">1000 µF Low-ESR</text>
  <text x="690" y="395" fill="#fef08a" font-size="10" text-anchor="middle">Across VCC &amp; GND</text>

  <!-- Wires -->
  <!-- SIM800L TX to ESP32 RX16 -->
  <path d="M 605 175 L 430 150 L 255 175" fill="none" stroke="#10b981" stroke-width="2"/>
  <!-- ESP32 TX17 to Divider to SIM800L RX -->
  <line x1="255" y1="225" x2="340" y2="225" stroke="#f43f5e" stroke-width="2"/>
  <line x1="520" y1="225" x2="605" y2="225" stroke="#f43f5e" stroke-width="2"/>
  <!-- Common GND -->
  <line x1="255" y1="275" x2="340" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="275" x2="605" y2="275" stroke="#64748b" stroke-width="2"/>
</svg>