<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <text x="450" y="35" fill="#f59e0b" font-size="22" font-weight="bold" text-anchor="middle">Power Path &amp; Voltage Distribution Architecture</text>
  <text x="450" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">LiPo 3.7V Battery, Adafruit BQ24074 / TP4056, Pololu S7V8F3 &amp; 1000 µF Low-ESR Buffer</text>

  <!-- LiPo Battery -->
  <rect x="50" y="120" width="180" height="130" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="140" y="155" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">LiPo Battery</text>
  <text x="140" y="180" fill="#ffffff" font-size="12" text-anchor="middle">3.7V Nominal (4.2V Max)</text>
  <text x="140" y="202" fill="#ffffff" font-size="12" text-anchor="middle">2000mAh Proto / 400mAh V2</text>
  <text x="140" y="225" fill="#a7f3d0" font-size="11" text-anchor="middle">PCM Protection Built-in</text>

  <!-- Charger / PMIC -->
  <rect x="290" y="120" width="220" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="150" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">Adafruit BQ24074</text>
  <text x="400" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">(Or TP4056 with Protection)</text>
  <text x="400" y="197" fill="#ffffff" font-size="12" text-anchor="middle">USB-C / 2-Pin Magnetic In</text>
  <text x="400" y="217" fill="#ffffff" font-size="12" text-anchor="middle">Dynamic Power-Path (NVDC)</text>
  <text x="400" y="240" fill="#fde68a" font-size="11" text-anchor="middle">System Runs While Charging</text>

  <!-- 3.3V Regulator -->
  <rect x="580" y="100" width="260" height="120" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="710" y="130" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">Pololu S7V8F3 (Buck-Boost)</text>
  <text x="710" y="155" fill="#ffffff" font-size="12" text-anchor="middle">Input: 2.8V - 16V -&gt; Output: 3.3V 1A</text>
  <text x="710" y="177" fill="#ffffff" font-size="12" text-anchor="middle">Powers ESP32 + NEO-6M + Sensors</text>
  <text x="710" y="200" fill="#93c5fd" font-size="11" text-anchor="middle">No dropouts when battery discharges!</text>

  <!-- GSM High Current Rail -->
  <rect x="580" y="270" width="260" height="160" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="710" y="300" fill="#fda4af" font-size="16" font-weight="bold" text-anchor="middle">SIM800L / A7670E Power Rail</text>
  <text x="710" y="325" fill="#ffffff" font-size="12" text-anchor="middle">Direct Battery / SYS Rail (3.8V - 4.2V)</text>
  <rect x="600" y="340" width="220" height="42" rx="6" fill="#78350f" stroke="#f59e0b"/>
  <text x="710" y="360" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">1000 µF Panasonic Low-ESR</text>
  <text x="710" y="375" fill="#fef08a" font-size="10" text-anchor="middle">+ 10µF Ceramic + 100nF Decoupling</text>
  <text x="710" y="410" fill="#fca5a5" font-size="11" text-anchor="middle">Supplies 2A Pulses (TDD-LTE / 2G Bursts)</text>

  <!-- Connecting Lines -->
  <line x1="230" y1="185" x2="290" y2="185" stroke="#10b981" stroke-width="2.5"/>
  <line x1="510" y1="160" x2="580" y2="160" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="510" y1="210" x2="540" y2="210" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="540" y1="210" x2="540" y2="350" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="540" y1="350" x2="580" y2="350" stroke="#f43f5e" stroke-width="2.5"/>
</svg>