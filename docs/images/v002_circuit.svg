<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <text x="425" y="35" fill="#38bdf8" font-size="22" font-weight="bold" text-anchor="middle">V0.0.2: ESP32 &lt;-&gt; NEO-6M GPS Wiring</text>
  <text x="425" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">UART1 NMEA Sentences Parsing via TinyGPS++</text>

  <!-- ESP32 -->
  <rect x="80" y="90" width="240" height="300" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="200" y="125" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">ESP32 DevKit</text>

  <rect x="95" y="160" width="210" height="32" rx="4" fill="#334155"/>
  <text x="105" y="181" fill="#f8fafc" font-size="13">GPIO 18 (RX1)</text>
  <circle cx="295" cy="176" r="5" fill="#10b981"/>

  <rect x="95" y="210" width="210" height="32" rx="4" fill="#334155"/>
  <text x="105" y="231" fill="#f8fafc" font-size="13">GPIO 19 (TX1 - opt)</text>
  <circle cx="295" cy="226" r="5" fill="#38bdf8"/>

  <rect x="95" y="260" width="210" height="32" rx="4" fill="#334155"/>
  <text x="105" y="281" fill="#f8fafc" font-size="13">3V3 / 5V OUT</text>
  <circle cx="295" cy="276" r="5" fill="#ef4444"/>

  <rect x="95" y="310" width="210" height="32" rx="4" fill="#334155"/>
  <text x="105" y="331" fill="#f8fafc" font-size="13">GND</text>
  <circle cx="295" cy="326" r="5" fill="#64748b"/>

  <!-- NEO-6M GPS -->
  <rect x="520" y="90" width="250" height="300" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="645" y="125" fill="#34d399" font-size="18" font-weight="bold" text-anchor="middle">NEO-6M GPS Module</text>

  <rect x="535" y="160" width="220" height="32" rx="4" fill="#334155"/>
  <circle cx="545" cy="176" r="5" fill="#10b981"/>
  <text x="560" y="181" fill="#f8fafc" font-size="13">TX (Data to ESP32)</text>

  <rect x="535" y="210" width="220" height="32" rx="4" fill="#334155"/>
  <circle cx="545" cy="226" r="5" fill="#38bdf8"/>
  <text x="560" y="231" fill="#f8fafc" font-size="13">RX (Config from ESP32)</text>

  <rect x="535" y="260" width="220" height="32" rx="4" fill="#334155"/>
  <circle cx="545" cy="276" r="5" fill="#ef4444"/>
  <text x="560" y="281" fill="#f8fafc" font-size="13">VCC (3.0V - 5.0V)</text>

  <rect x="535" y="310" width="220" height="32" rx="4" fill="#334155"/>
  <circle cx="545" cy="326" r="5" fill="#64748b"/>
  <text x="560" y="331" fill="#f8fafc" font-size="13">GND</text>

  <!-- Wires -->
  <line x1="295" y1="176" x2="545" y2="176" stroke="#10b981" stroke-width="2.5"/>
  <line x1="295" y1="226" x2="545" y2="226" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
  <line x1="295" y1="276" x2="545" y2="276" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="295" y1="326" x2="545" y2="326" stroke="#64748b" stroke-width="2.5"/>
</svg>