<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="950" height="540" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <text x="475" y="35" fill="#38bdf8" font-size="22" font-weight="bold" text-anchor="middle">V0.0.3: GPS SOS Alert + Bluetooth LE Companion</text>
  <text x="475" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">Dual-Alert System: Long-Range GSM Emergency SMS + Short-Range BLE GATT Notification</text>

  <!-- ESP32 Hub -->
  <rect x="340" y="90" width="270" height="380" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="475" y="125" fill="#38bdf8" font-size="19" font-weight="bold" text-anchor="middle">ESP32 DevKit</text>
  <text x="475" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">BLE GATT Server + Dual UART</text>

  <rect x="355" y="165" width="240" height="28" rx="4" fill="#334155"/>
  <text x="365" y="184" fill="#f8fafc" font-size="12">GPIO 16 (RX2) &lt;- SIM800L TX</text>

  <rect x="355" y="200" width="240" height="28" rx="4" fill="#334155"/>
  <text x="365" y="219" fill="#f8fafc" font-size="12">GPIO 17 (TX2) -&gt; SIM800L RX (Div)</text>

  <rect x="355" y="235" width="240" height="28" rx="4" fill="#334155"/>
  <text x="365" y="254" fill="#f8fafc" font-size="12">GPIO 18 (RX1) &lt;- NEO-6M TX</text>

  <rect x="355" y="270" width="240" height="28" rx="4" fill="#334155"/>
  <text x="365" y="289" fill="#f8fafc" font-size="12">GPIO 4 &lt;- Omron SOS Button</text>

  <rect x="355" y="305" width="240" height="28" rx="4" fill="#334155"/>
  <text x="365" y="324" fill="#f8fafc" font-size="12">GPIO 2 -&gt; Status LED (330Ω)</text>

  <rect x="355" y="340" width="240" height="115" rx="6" fill="#1e1b4b" stroke="#60a5fa"/>
  <text x="475" y="362" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">BLE GATT Profile</text>
  <text x="475" y="382" fill="#e2e8f0" font-size="11" text-anchor="middle">• Service: 4fafc201-1fb5-459e...</text>
  <text x="475" y="402" fill="#38bdf8" font-size="11" text-anchor="middle">• Char SOS: Notify on Trigger</text>
  <text x="475" y="422" fill="#34d399" font-size="11" text-anchor="middle">• Char Location: Real-time Lat/Lng</text>
  <text x="475" y="442" fill="#fbbf24" font-size="11" text-anchor="middle">• Proximity RSSI "Digital Leash"</text>

  <!-- Left: NEO-6M & SOS Button -->
  <rect x="50" y="90" width="230" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="165" y="120" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">NEO-6M GPS</text>
  <text x="165" y="145" fill="#ffffff" font-size="12" text-anchor="middle">Continuously streams</text>
  <text x="165" y="165" fill="#ffffff" font-size="12" text-anchor="middle">valid Latitude &amp; Longitude</text>
  <text x="165" y="195" fill="#6ee7b7" font-size="11" text-anchor="middle">TinyGPS++ Object</text>

  <rect x="50" y="270" width="230" height="195" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="165" y="300" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">SOS Omron Button</text>
  <text x="165" y="325" fill="#ffffff" font-size="12" text-anchor="middle">GPIO 4 with Pull-Up</text>
  <text x="165" y="348" fill="#fef08a" font-size="11" text-anchor="middle">Debounced / Long Press</text>
  <rect x="70" y="365" width="190" height="40" rx="4" fill="#334155"/>
  <text x="165" y="388" fill="#fde68a" font-size="12" text-anchor="middle">Kingbright Red LED (GPIO 2)</text>
  <text x="165" y="445" fill="#94a3b8" font-size="11" text-anchor="middle">Blinks on trigger &amp; BLE link</text>

  <!-- Right: SIM800L & Parent BLE App -->
  <rect x="670" y="90" width="230" height="170" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="785" y="120" fill="#fda4af" font-size="16" font-weight="bold" text-anchor="middle">SIM800L Modem</text>
  <text x="785" y="145" fill="#ffffff" font-size="12" text-anchor="middle">Triggered by SOS Button</text>
  <text x="785" y="170" fill="#fda4af" font-size="11" text-anchor="middle">Sends SMS:</text>
  <text x="785" y="190" fill="#ffffff" font-size="10" text-anchor="middle">"EMERGENCY! My location:</text>
  <text x="785" y="208" fill="#38bdf8" font-size="10" text-anchor="middle">https://maps.google.com/?q=..."</text>
  <text x="785" y="240" fill="#f43f5e" font-size="11" text-anchor="middle">Long-Range GSM Telemetry</text>

  <rect x="670" y="290" width="230" height="175" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="785" y="320" fill="#93c5fd" font-size="16" font-weight="bold" text-anchor="middle">Parent Mobile App</text>
  <text x="785" y="345" fill="#bfdbfe" font-size="12" text-anchor="middle">Bluetooth Low Energy</text>
  <text x="785" y="375" fill="#ffffff" font-size="11" text-anchor="middle">• Instant Buzz on SOS notify</text>
  <text x="785" y="395" fill="#ffffff" font-size="11" text-anchor="middle">• Live map link without cellular</text>
  <text x="785" y="415" fill="#ffffff" font-size="11" text-anchor="middle">• RSSI Proximity Detection</text>
  <text x="785" y="445" fill="#60a5fa" font-size="11" text-anchor="middle">Short-Range Companion</text>

  <!-- Connection Lines -->
  <line x1="280" y1="165" x2="340" y2="249" stroke="#10b981" stroke-width="2"/>
  <line x1="280" y1="367" x2="340" y2="284" stroke="#f59e0b" stroke-width="2"/>
  <line x1="610" y1="200" x2="670" y2="165" stroke="#f43f5e" stroke-width="2"/>
  <line x1="610" y1="380" x2="670" y2="380" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
</svg>